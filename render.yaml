services:
  - type: web
    name: netflix-dispo-checker
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: ACCESS_TOKEN
        sync: false
      - key: CHECK_WORKERS
        value: "12"
      - key: CHECK_MAX_CONNECTIONS
        value: "24"
      - key: CHECK_CONNECT_TIMEOUT
        value: "5"
      - key: CHECK_READ_TIMEOUT
        value: "12"
      - key: MAX_ACCOUNTS_PER_REQUEST
        value: "25"
