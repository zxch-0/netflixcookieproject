<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Netflix Dispo Checker</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="bg" aria-hidden="true">
  <span class="blob b1"></span>
  <span class="blob b2"></span>
  <span class="blob b3"></span>
  <div class="bg-grid"></div>
</div>
<div class="stars" aria-hidden="true"></div>
<div class="scanlines" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>
<div class="watermark" aria-hidden="true">N</div>
<div class="deco deco-tl" aria-hidden="true"></div>
<div class="deco deco-tr" aria-hidden="true"></div>
<div class="deco deco-bl" aria-hidden="true"></div>
<div class="deco deco-br" aria-hidden="true"></div>

<header class="topbar">
  <div class="brand"><span class="logo">N</span>
    <div><h1>Netflix Dispo Checker</h1><p class="sub">Drop cookie files or paste them, get plans sorted by tier with NFToken links.</p></div>
  </div>
  <div class="topbar-right">
    <input id="token" class="token" type="password" placeholder="access token" autocomplete="off" hidden>
    <span id="proxyInfo" class="pill"></span>
  </div>
</header>
<main>
  <section class="card">
    <div id="drop" class="drop" role="button" tabindex="0" aria-label="Add cookie files">
      <input id="files" type="file" multiple accept=".txt,.json,.csv,.zip,text/plain,application/json,application/zip" hidden>
      <p class="drop-title">Drop <b>.txt</b> / <b>.json</b> / <b>.zip</b> cookie files here</p>
      <p class="drop-sub">or <button id="browse" class="link" type="button">browse files</button></p>
    </div>
    <div class="file-list-head"><span id="fileCount" class="file-count"></span></div>
    <div id="fileList" class="file-list"></div>
    <label class="field"><span class="label">Or paste cookies</span>
      <textarea id="cookies" spellcheck="false" placeholder="Netscape, JSON export or NetflixId=...;SecureNetflixId=...
Files and pasted text are combined in the same run."></textarea>
    </label>
    <div class="grid">
      <fieldset class="field devices"><legend class="label">NFToken links</legend>
        <label><input type="checkbox" name="device" value="pc" checked> PC</label>
        <label><input type="checkbox" name="device" value="mobile"> Mobile</label>
        <label><input type="checkbox" name="device" value="tv"> TV</label>
      </fieldset>
      <label class="field"><span class="label">Concurrency <output id="concOut">8</output></span>
        <input id="concurrency" type="range" min="1" max="32" value="8">
      </label>
      <label class="field"><span class="label">Proxies (optional)</span>
        <textarea id="proxies" class="small" spellcheck="false" placeholder="host:port:user:pass — one per line"></textarea>
      </label>
    </div>
    <div class="actions">
      <button id="run" class="primary">Check cookies</button>
      <button id="clear" class="ghost" type="button">Clear files</button>
      <button id="stop" class="ghost" disabled>Stop</button>
      <span id="status" class="status"></span>
    </div>
  </section>
  <section id="progressWrap" class="card" hidden>
    <div class="progress-head"><strong id="progressText">0 / 0</strong><span id="shownInfo" class="shown"></span><span id="counters" class="counters"></span></div>
    <div class="bar"><div id="bar" class="bar-fill"></div></div>
    <div class="actions"><a id="dlTxt" class="ghost" href="#">Download TXT</a><a id="dlJson" class="ghost" href="#">Download JSON</a></div>
  </section>
  <section id="filters" class="chips" hidden></section>
  <section id="results"></section>
</main>
<template id="resultTpl">
  <article class="result">
    <div class="result-head">
      <span class="rank"></span><span class="badge plan"></span><span class="country"></span>
      <span class="badge warn hold" hidden>on hold</span><span class="badge warn extra" hidden>extra member</span>
      <span class="source"></span><span class="spacer"></span>
      <button class="copy ghost" data-copy="links">Copy links</button>
      <button class="copy ghost" data-copy="cookie">Copy cookie</button>
    </div>
    <div class="result-body">
      <div class="kv"><span>Email</span><b class="email"></b></div>
      <div class="kv"><span>Name</span><b class="name"></b></div>
      <div class="kv"><span>Streams</span><b class="streams"></b></div>
      <div class="kv"><span>Quality</span><b class="quality"></b></div>
      <div class="kv"><span>Price</span><b class="price"></b></div>
      <div class="kv"><span>Profiles</span><b class="profiles"></b></div>
      <div class="kv"><span>NFToken</span><b class="nftoken mono"></b></div>
      <div class="kv"><span>Valid till</span><b class="expires"></b></div>
      <div class="kv error" hidden><span>Note</span><b class="note"></b></div>
      <div class="links"></div>
    </div>
  </article>
</template>
<script src="/static/app.js"></script>
</body>
</html>
